name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The tests make their own commits. Each temp repo sets a local identity,
      # so this is only a backstop against a runner with no global one at all.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: python -m pytest
